# Fallback CI build — produces an UNSIGNED, UNNOTARIZED dmg, so it is
# manual-trigger only. Real releases are built locally with
# scripts/release.sh (Developer ID + notarization need the certificate
# and notary credentials, which live only in the developer's keychain)
# and uploaded to the GitHub release by hand.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -scheme ClipboardHistory -configuration Release \
            -derivedDataPath build build

      - name: Package DMG
        run: |
          mkdir stage
          cp -R build/Build/Products/Release/ClipboardHistory.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "ClipboardHistory" -srcfolder stage \
            -format UDZO ClipboardHistory.dmg

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipboardHistory.dmg
          generate_release_notes: true
